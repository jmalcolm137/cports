# Memory and swap tunings from CachyOS-Settings (70-cachyos-settings.conf).
# swappiness is at 100 so zswap/zram are used before dropping page cache.
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# no readahead on compressed swap
vm.page-cluster = 0

[general]
name = bcachefs
version = @VERSION@
make = gmake
initramfs = yes

[hooks]
# Chimera builds linux-stable with CONFIG_RUST=n, and the vendored Rust stack
# in bcachefs 1.39.7 generates a target spec that current rustc rejects when
# CONFIG_RUSTC_VERSION is 0. C-only is a supported upstream configuration.
build = ${MAKE} ${CKMS_MAKE_ARGS} -C . -j${CKMS_JOBS} KDIR="${CKMS_KERNEL_HDRDIR}" BCACHEFS_RUST=0

[module.bcachefs]
path = src/fs/bcachefs
dest = extra
